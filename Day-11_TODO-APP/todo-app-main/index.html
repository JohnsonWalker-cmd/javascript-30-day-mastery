<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Todo app</title>
  <link rel="stylesheet" href="./index.css">
  
</head>
<body>

  <main class="container">
    <header class="header">
      <h1 class="logo">TODO</h1>
      <div class="toggle">
        <img src="./images/icon-moon.svg" alt="moon">
      </div>
    </header>

    <div class="new_todo">
        <span class="just_circle"></span>
        <input type="text" placeholder="Create a new todo..." id="add-todo">
    </div>
    <div class="todo-item_container">
      <ul class="todo-list" id="todo_list">
        <!--<li class="todo-item">
          <span class="check-circle"></span>
          <p class="task-text">Jog around the park 3x</p>
          <button class="delete-btn">✕</button>
        </li>-->
        <!--more lists-->
      </ul>
      <div class="todo-footer">
        <span class="items-left"><span id="item_count"></span></span>
        <div class="filters">
          <button class="filter-btn active">All</button>
          <button class="filter-btn">Active</button>
          <button class="filter-btn">Completed</button>
        </div>
        <button class="clear-completed">Clear Completed</button>
      </div>
    </div>
  </main>

  <script src="./index.js"></script>
</body>
</html>
